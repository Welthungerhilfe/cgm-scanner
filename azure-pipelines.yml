trigger:
  - dump_consent_sheet
  - test-keystore
  - bug_offline_results
  - bug_offline_results_1
  - syria_backend_release
  - 11.0.0-release
  - master-realsense
  - master-realsense-aab

variables:
  - group: TEST_CGM
  - name: system.debug
    value: 'false'
  - name: MOBILECENTER_OUTPUT_DIRECTORY
    value: $(Build.ArtifactStagingDirectory)/build
  - name: MOBILECENTER_BRANCH
    value: dump_consent_sheet
  - name: MOBILECENTER_BUILD_ID
    value: $(Build.BuildNumber)
  - name: MOBILECENTER_SOURCE_DIRECTORY
    value: $(Build.Repository.LocalPath)
  - name: MOBILECENTER_TRIGGER
    value: continuous
  - name: APPCENTER_OUTPUT_DIRECTORY
    value: $(Build.ArtifactStagingDirectory)/build
  - name: APPCENTER_BRANCH
    value: dump_consent_sheet
  - name: APPCENTER_BUILD_ID
    value: $(Build.BuildNumber)
  - name: APPCENTER_SOURCE_DIRECTORY
    value: $(Build.Repository.LocalPath)
  - name: APPCENTER_TRIGGER
    value: continuous
  - name: artifactVersioning.build.format
    value: timestamp
  - name: buildScripts.toolset
    value: '{"app":{"postClone":"app/appcenter-post-clone.sh"}}'
  - name: moduleName
    value: app
  - name: buildVariant
    value: arcoreRelease
  - name: isRoot
    value: 'false'
  - name: runTests
    value: 'true'
  - name: runLint
    value: 'true'
  - name: keystoreFilename
    value: cgm-scanner.jks
  - name: automaticSigning
    value: 'false'
  - name: buildBundle
    value: 'true'
  - name: MOBILECENTER_ANDROID_MODULE
    value: app
  - name: MOBILECENTER_ANDROID_VARIANT
    value: arcoreRelease
  - name: APPCENTER_ANDROID_MODULE
    value: app
  - name: APPCENTER_ANDROID_VARIANT
    value: arcoreRelease
  - name: sonoma.tags
    value: 'continuous,android,signed,tests'
  - name: artifactVersioning.build.value
    value: '0'

name: $(artifactVersioning.build.value)

resources:
  repositories:
    - repository: self
      type: git
      ref: dump_consent_sheet

jobs:
  - job: Phase_1
    displayName: Build
    timeoutInMinutes: 30
    cancelTimeoutInMinutes: 0
    pool:
      name: Azure Pipelines
      vmImage: 'macOS-latest'

    steps:
      - checkout: self
        clean: true
        submodules: recursive
        lfs: true

      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'

      - task: Bash@3
        displayName: Debug Variable Group Loading
        inputs:
          targetType: inline
          script: |
            echo "Verifying TEST_CGM variable group loading..."
            echo "PROJECT_NUMBER: $(PROJECT_NUMBER)"
            echo "PROJECT_ID: $(PROJECT_ID)"
            echo "MOBILESDK_APP_ID: $(MOBILESDK_APP_ID)"
            echo "API_KEY: $(API_KEY)"
            echo "API_URL_SYRIA: $(API_URL_SYRIA)"
            echo "OAUTH_URL_SYRIA: $(OAUTH_URL_SYRIA)"
            echo "Verify Java installation:"
            echo "JAVA_HOME: $JAVA_HOME"
            echo "OAUTH_SCOPE_SYRIA: $(OAUTH_SCOPE_SYRIA)"
            echo "OAUTH_CLIENT_ID_SYRIA: $(OAUTH_CLIENT_ID_SYRIA)"
            echo "Verify Java installation:"
            echo "JAVA_HOME: $JAVA_HOME"
            java -version

      - task: ShellScript@2
        displayName: Post Clone Script
        inputs:
          scriptPath: app/appcenter-post-clone.sh
        env:
          PROJECT_NUMBER: $(PROJECT_NUMBER)
          PROJECT_ID: $(PROJECT_ID)
          MOBILESDK_APP_ID: $(MOBILESDK_APP_ID)
          API_KEY: $(API_KEY)
          APP_CENTER_KEY: $(APP_CENTER_KEY)
          GOOGLE_MAPS_KEY: $(GOOGLE_MAPS_KEY)
          OAUTH_PATH: $(OAUTH_PATH)

      - task: DownloadSecureFile@1
        displayName: Download Keystore File
        name: keystoreFile
        inputs:
          secureFile: cgm-scanner.jks

      - task: Bash@3
        displayName: Set Keystore Path
        inputs:
          targetType: inline
          script: |
            echo "##vso[task.setvariable variable=KEYSTORE_PATH]$(keystoreFile.secureFilePath)"
            echo "Keystore path: $(keystoreFile.secureFilePath)"
            ls -la "$(keystoreFile.secureFilePath)"

      - task: Bash@3
        displayName: Verify Keystore and Generate Key Hash
        inputs:
          targetType: inline
          script: |
            keytool -list -v -keystore "$(KEYSTORE_PATH)" -storepass "$(KEYSTORE_PASSWORD)" -alias "$(KEY_ALIAS)"
            HASH=$(keytool -exportcert -alias "$(KEY_ALIAS)" -keystore "$(KEYSTORE_PATH)" -storepass "$(KEYSTORE_PASSWORD)" | openssl sha1 -binary | openssl base64)
            echo "Generated Key Hash: $HASH"
        env:
          KEYSTORE_PASSWORD: $(KEYSTORE_PASSWORD)
          KEY_ALIAS: $(KEY_ALIAS)
          KEY_PASSWORD: $(KEY_PASSWORD)

      - task: Gradle@1
        displayName: Build and Sign AAB
        inputs:
          tasks: >-
            clean :app:bundleArcoreRelease :app:testArcoreRelease :app:lintArcoreRelease
          options: >-
            -Pandroid.injected.signing.store.file="$(KEYSTORE_PATH)"
            -Pandroid.injected.signing.store.password="$(KEYSTORE_PASSWORD)"
            -Pandroid.injected.signing.key.alias="$(KEY_ALIAS)"
            -Pandroid.injected.signing.key.password="$(KEY_PASSWORD)"
            -Pandroid.injected.version.code="$(Build.BuildId)"
            -Pandroid.injected.version.name="$(Build.BuildNumber)"
          jdkArchitecture: x64
          gradleOptions: '-Xmx3072m'
          publishJUnitResults: true
          testResultsFiles: '**/TEST-*.xml'
        env:
          KEYSTORE_PASSWORD: $(KEYSTORE_PASSWORD)
          KEY_ALIAS: $(KEY_ALIAS)
          KEY_PASSWORD: $(KEY_PASSWORD)

      - task: CopyFiles@2
        displayName: Copy build files to staging
        inputs:
          SourceFolder: $(build.sourcesdirectory)/app/build/outputs
          Contents: bundle/**/*.aab
          TargetFolder: $(build.artifactstagingdirectory)/build
          OverWrite: true
          flattenFolders: true

      - task: PublishBuildArtifacts@1
        displayName: Publish build
        inputs:
          PathtoPublish: $(build.artifactstagingdirectory)/build
          ArtifactName: build